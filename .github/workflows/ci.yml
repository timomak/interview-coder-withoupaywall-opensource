name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  informational-p01-mirror:
    name: Informational P01 mirror (non-authoritative)
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.20.2
        cache: 'npm'

    - name: Confirm pinned hosted toolchain
      run: |
        test "$(node --version)" = "v20.20.2"
        test "$(npm --version)" = "10.8.2"

    - name: Install pinned lockfile closure
      run: npm ci

    - name: Run informational mirrors
      run: |
        npm run verify:policy
        npm run lint
        npm run typecheck
        npm test
        npm run build
