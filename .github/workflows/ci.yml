name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  mirror-local-p01-gate:
    name: Mirror authoritative P01 local gate
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Run the authoritative local command
      run: npm run verify:phase -- --phase P01 --artifacts .artifacts/verification/P01
